name: Tests and release
# CI runs on Forgejo only; GitHub is the mirror source without workflows.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.5']
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: vereinskiste_test
          POSTGRES_USER: vk
          POSTGRES_PASSWORD: vk
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vk -d vereinskiste_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VK_TEST_DSN: pgsql:host=127.0.0.1;dbname=vereinskiste_test
      VK_TEST_USER: vk
      VK_TEST_PASS: vk
      VK_UPDATE_PACKAGE: ${{ forgejo.workspace }}/dist/vereinskiste-ci.zip
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ forgejo.token }}
          persist-credentials: false
      # shivammathur/setup-php is not mirrored on the Forgejo instance, so PHP
      # is installed from the ondrej PPA instead.
      - name: Setup PHP
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:ondrej/php
          sudo apt-get update
          sudo apt-get install -y php${{ matrix.php }}-cli php${{ matrix.php }}-pgsql php${{ matrix.php }}-mbstring php${{ matrix.php }}-fileinfo php${{ matrix.php }}-gd php${{ matrix.php }}-openssl php${{ matrix.php }}-zip php${{ matrix.php }}-curl
          curl -sS https://getcomposer.org/installer | sudo php -- --install-dir=/usr/local/bin --filename=composer
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix tests --ignore-scripts
      - run: npm test --prefix tests
      - run: composer validate --strict --working-dir=app
      - run: composer install --working-dir=app --prefer-dist --no-interaction
      - run: composer audit --locked --working-dir=app
      - run: sh scripts/build-release.sh ci
      - run: cd app && vendor/bin/phpunit
      - uses: actions/upload-artifact@v4
        if: matrix.php == '8.5'
        with:
          name: vereinskiste-release
          path: dist/vereinskiste-ci.zip
