name: Tests and release
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.4', '8.5']
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: vereinskiste_test
          POSTGRES_USER: vk
          POSTGRES_PASSWORD: vk
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vk -d vereinskiste_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VK_TEST_DSN: pgsql:host=127.0.0.1;dbname=vereinskiste_test
      VK_TEST_USER: vk
      VK_TEST_PASS: vk
      VK_UPDATE_PACKAGE: ${{ github.workspace }}/dist/vereinskiste-ci.zip
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: pdo_pgsql, mbstring, fileinfo, gd, openssl, zip, sodium, curl
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix tests --ignore-scripts
      - run: npm test --prefix tests
      - run: composer validate --strict --working-dir=app
      - run: composer install --working-dir=app --prefer-dist --no-interaction
      - run: composer audit --locked --working-dir=app
      - run: sh scripts/build-release.sh ci
      - name: Install local document processing tools
        if: matrix.php == '8.4'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap clamav poppler-utils tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng
          # Isolated CI fixture: no production signature state or credentials.
          printf '%s\n' '44d88612fea8a8f36de82e1278abb02f:68:VK.Test.Eicar' | sudo tee /var/lib/clamav/vk-test.hdb > /dev/null
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: cd app && vendor/bin/phpunit
        env:
          VK_INTAKE_PROCESSING_TEST: ${{ matrix.php == '8.4' && '1' || '0' }}
      - uses: actions/upload-artifact@v4
        if: matrix.php == '8.4'
        with:
          name: vereinskiste-release
          path: dist/vereinskiste-ci.zip
